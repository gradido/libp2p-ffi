# Two nodes, each behind its own NAT router, and a relay on the network between the routers.
#
#   lan-a 10.99.1.0/24          public 10.99.0.0/24          lan-b 10.99.2.0/24
#   dialer .10 -- router-a .2 | .11 -- relay .10 -- .12 | .2 router-b -- .10 listener
#
# All three networks are internal: nothing reaches the host or the internet, and the nodes reach
# each other only through the routers. run.sh drives it.
name: lp2p-holepunch

x-node: &node
  build:
    context: .
    dockerfile: Dockerfile.node
  image: lp2p-holepunch-node
  cap_add: [NET_ADMIN]

x-router: &router
  build:
    context: .
    dockerfile: Dockerfile.router
  image: lp2p-holepunch-router
  cap_add: [NET_ADMIN]
  sysctls:
    net.ipv4.ip_forward: 1

services:
  relay:
    <<: *node
    environment:
      ROLE: relay
      TRANSPORT: ${TRANSPORT:-tcp}
    networks:
      public:
        ipv4_address: 10.99.0.10

  router-a:
    <<: *router
    environment:
      NAT: ${NAT:-cone}
      PUBLIC_PREFIX: "10.99.0."
      LAN_PREFIX: "10.99.1."
    networks:
      public:
        ipv4_address: 10.99.0.11
      lan-a:
        ipv4_address: 10.99.1.2

  router-b:
    <<: *router
    environment:
      NAT: ${NAT:-cone}
      PUBLIC_PREFIX: "10.99.0."
      LAN_PREFIX: "10.99.2."
    networks:
      public:
        ipv4_address: 10.99.0.12
      lan-b:
        ipv4_address: 10.99.2.2

  listener:
    <<: *node
    depends_on: [relay, router-b]
    environment:
      ROLE: listener
      TRANSPORT: ${TRANSPORT:-tcp}
      LP2P_TRACE: ${LP2P_TRACE:-}
      GATEWAY: 10.99.2.2
    networks:
      lan-b:
        ipv4_address: 10.99.2.10

  dialer:
    <<: *node
    depends_on: [listener, router-a]
    environment:
      ROLE: dialer
      TRANSPORT: ${TRANSPORT:-tcp}
      LP2P_TRACE: ${LP2P_TRACE:-}
      GATEWAY: 10.99.1.2
    networks:
      lan-a:
        ipv4_address: 10.99.1.10

networks:
  public:
    internal: true
    ipam:
      config: [{ subnet: 10.99.0.0/24 }]
  lan-a:
    internal: true
    ipam:
      config: [{ subnet: 10.99.1.0/24 }]
  lan-b:
    internal: true
    ipam:
      config: [{ subnet: 10.99.2.0/24 }]
